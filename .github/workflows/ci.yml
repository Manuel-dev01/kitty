name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitty
          POSTGRES_PASSWORD: kitty
          POSTGRES_DB: kitty_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database: the ledger's Postgres tests run in their own schemas here.
      TEST_DATABASE_URL: postgres://kitty:kitty@localhost:5432/kitty_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
